[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-signal-radar"
version = "0.1.0"
description = "Deep research agent consolidating signals on AI agent harnesses and workflow automation, built with Google ADK."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "turanbulmus" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-adk>=2.15.0,<3.0.0",
    "google-genai>=2.34.0,<4.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.39.0,<=1.45.2",
    "opentelemetry-sdk>=1.39.0,<=1.45.2",
    "google-cloud-secret-manager>=2.22.0,<3.0.0",
    "aiosqlite>=0.21.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-dlp>=3.25.0",
    "google-cloud-modelarmor>=0.7.0",
    "google-cloud-aiplatform[agent_engines,evaluation]>=2.2.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
harness-signal-radar = "scripts.demo_cli:main"

[tool.setuptools.packages.find]
include = ["harness_signal_radar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:harness_signal_radar.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
